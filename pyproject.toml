[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "aicomply"
version = "0.2.0"
description = "Asistente conversacional en español para evaluar el cumplimiento de sistemas de IA con el AI Act europeo (Reglamento UE 2024/1689)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "AIComply Contributors" }]
keywords = ["ai-act", "compliance", "ia", "unión-europea", "llm", "streamlit", "pyme"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: Spanish",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "anthropic>=0.52.0",
    "streamlit>=1.39.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "httpx>=0.27.0",
    "openai>=1.30.0",
    "fpdf2>=2.7.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.urls]
Homepage    = "https://github.com/ComunidadIA-OS/aicomply"
Repository  = "https://github.com/ComunidadIA-OS/aicomply"
Issues      = "https://github.com/ComunidadIA-OS/aicomply/issues"
Changelog   = "https://github.com/ComunidadIA-OS/aicomply/releases"

# ── Ruff (linter y formateador) ───────────────────────────────────────────────
[tool.ruff]
line-length   = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src", "prompts", "config"]

# ── Mypy (comprobación de tipos) ──────────────────────────────────────────────
[tool.mypy]
python_version      = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
strict_optional     = true

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths   = ["tests"]
python_files = ["test_*.py"]
addopts     = "-v --tb=short"
